<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Walk 随机路线骰子 · 广州版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F6B4F'/%3E%3Ccircle cx='10' cy='10' r='2.6' fill='%23F6F4EC'/%3E%3Ccircle cx='22' cy='10' r='2.6' fill='%23F6F4EC'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23E07A3E'/%3E%3Ccircle cx='10' cy='22' r='2.6' fill='%23F6F4EC'/%3E%3Ccircle cx='22' cy='22' r='2.6' fill='%23F6F4EC'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F6F4EC; --ink:#23352B; --green:#2F6B4F; --green-deep:#224E39;
  --green-soft:#E3EDE6; --orange:#E07A3E; --orange-soft:#FBEADD;
  --card:#FFFFFF; --line:#DCE2D8; --muted:#6E7E73;
  --size:118px;
  --shadow-card:0 1px 2px rgba(34,78,57,.05),0 8px 24px rgba(34,78,57,.07);
  --shadow-dice:0 8px 20px rgba(34,78,57,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5}
body{padding:32px 20px 64px}
.wrap{max-width:1080px;margin:0 auto}
header{margin-bottom:24px}
.kicker{display:inline-block;font-size:12px;letter-spacing:2px;color:var(--green);
  background:var(--green-soft);padding:5px 12px;border-radius:999px;font-weight:600}
h1{font-size:32px;margin:14px 0 8px;letter-spacing:.5px;line-height:1.25}
h1 .accent{color:var(--orange)}
.subtitle{color:var(--muted);font-size:14.5px;max-width:560px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:20px 22px;margin-bottom:26px;display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-start;
  box-shadow:var(--shadow-card)}
.field{display:flex;flex-direction:column;gap:9px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:1.5px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;
  border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--green);color:var(--green)}
.chip.active{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.chip.active:hover{color:#fff}
.chip:disabled{background:#F1F2EE;color:#A9B1AA;cursor:not-allowed;border-style:dashed}
.dice-grid{display:grid;gap:18px 14px;margin-bottom:28px}
.dice-grid.cols-6{grid-template-columns:repeat(6,1fr)}
.dice-grid.cols-5{grid-template-columns:repeat(5,1fr)}
.dice-cell{display:flex;flex-direction:column;align-items:center;gap:11px;min-width:0}
.dice-name{font-size:13px;font-weight:700;letter-spacing:1px;white-space:nowrap}
.dice-name .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.scene{width:var(--size);height:var(--size);perspective:800px;cursor:pointer}
.scene.exhausted{cursor:not-allowed}
.scene.exhausted .cube{opacity:.5;filter:grayscale(.6)}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform 1.1s cubic-bezier(.2,.8,.25,1)}
.face{position:absolute;width:var(--size);height:var(--size);background:#fff;border:2px solid var(--green);
  border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:10px;font-size:12px;font-weight:600;line-height:1.45;backface-visibility:hidden;
  box-shadow:var(--shadow-dice)}
.face .q{font-size:34px;color:var(--green);font-weight:800}
.face.easter{border-color:var(--orange);color:var(--orange)}
.f1{transform:rotateY(0deg) translateZ(calc(var(--size)/2))}
.f2{transform:rotateY(180deg) translateZ(calc(var(--size)/2))}
.f3{transform:rotateY(90deg) translateZ(calc(var(--size)/2))}
.f4{transform:rotateY(-90deg) translateZ(calc(var(--size)/2))}
.f5{transform:rotateX(90deg) translateZ(calc(var(--size)/2))}
.f6{transform:rotateX(-90deg) translateZ(calc(var(--size)/2))}
.status{font-size:11px;color:var(--muted);min-height:16px;text-align:center;line-height:1.4;
  max-width:var(--size);width:100%}
.status.done{color:var(--green);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:28px}
.big-btn{border:none;border-radius:13px;padding:14px 26px;font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit;letter-spacing:1px;transition:transform .12s,opacity .15s,background .15s}
.big-btn:active{transform:scale(.97)}
.primary{background:var(--green);color:#fff}
.primary:hover{background:var(--green-deep)}
.warn{background:#fff;color:var(--orange);border:2px solid var(--orange)}
.warn:disabled{color:#B9BFB6;border-color:var(--line);background:#fff;cursor:not-allowed}
.dark{background:var(--ink);color:#fff}
.dark:disabled{background:#C9CEC7;cursor:not-allowed}
.hint-text{font-size:12.5px;color:var(--muted);flex-basis:100%}
.timer-box{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px 22px;margin-bottom:28px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow-card)}
.timer-label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:1px}
.timer-num{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;min-width:92px;color:var(--green-deep)}
.timer-box .spacer{flex:1}
.mini-btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 18px;
  font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.mini-btn:hover{border-color:var(--green);color:var(--green)}
.pass-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center;box-shadow:var(--shadow-card)}
.pass-box h2{font-size:19px;margin-bottom:6px}
.pass-box p{font-size:13px;color:var(--muted);margin-bottom:18px}
#passCanvas{max-width:100%;border-radius:14px;box-shadow:0 12px 32px rgba(34,78,57,.16);display:none}
#passCanvas.show{display:inline-block}
.pass-actions{margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.review-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center;margin-top:24px;box-shadow:var(--shadow-card)}
.review-box h2{font-size:19px;margin-bottom:6px}
.review-box p{font-size:13px;color:var(--muted);margin-bottom:18px}
.review-stars{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
.star-btn{width:46px;height:46px;cursor:pointer;background:none;border:none;padding:0}
.star-btn svg{width:100%;height:100%;fill:#D8D2C4;transition:transform .12s}
.star-btn.on svg{fill:#E07A3E}
.star-btn:hover svg{transform:scale(1.12)}
.star-btn:disabled{cursor:not-allowed}
.star-btn:disabled svg{fill:#E7E2D6;transform:none}
.review-hl-title{font-size:13px;font-weight:700;color:var(--green);margin-bottom:11px;letter-spacing:1px}
.review-highlight{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.hl-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:13px;cursor:pointer;color:var(--muted);transition:all .15s}
.hl-chip.on{background:var(--green);border-color:var(--green);color:#fff}
.hl-chip:disabled{cursor:not-allowed;opacity:.5}
.review-comment{font-size:15px;font-weight:700;color:var(--green);margin-bottom:18px;min-height:22px}
#reviewCanvas{max-width:100%;border-radius:14px;box-shadow:0 12px 32px rgba(34,78,57,.16);display:none}
#reviewCanvas.show{display:inline-block}
@media (max-width:960px){
  .dice-grid.cols-6,.dice-grid.cols-5{grid-template-columns:repeat(3,1fr)}
  :root{--size:108px}
}
@media (max-width:560px){
  body{padding:22px 14px 48px}
  h1{font-size:25px}
  .panel{padding:18px 16px;gap:18px}
  .dice-grid{gap:20px 14px}
  .dice-grid.cols-6,.dice-grid.cols-5{grid-template-columns:repeat(2,1fr)}
  :root{--size:calc((100vw - 28px - 14px)/2)}
  .face{font-size:11.5px;padding:8px}
  .face .q{font-size:30px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .actions #rollAllBtn{grid-column:1;width:100%}
  .actions #rerollBtn{grid-column:2;width:100%}
  .actions #passBtn{grid-column:1/-1;width:100%}
  .actions .hint-text{grid-column:1/-1}
  .big-btn{padding:14px 18px}
  .timer-box{flex-wrap:wrap;padding:16px 18px;gap:12px}
  .timer-num{min-width:0;font-size:26px}
  .timer-box .spacer{display:none}
  .pass-box,.review-box{padding:22px 16px}
}
.checkin-btn{border:1px solid var(--orange);background:var(--orange-soft);color:var(--orange);
  border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;
  font-family:inherit;white-space:nowrap;transition:all .15s}
.checkin-btn:hover:not(:disabled){background:var(--orange);color:#fff}
.checkin-btn:disabled{border-color:var(--line);background:#F1F2EE;color:#A9B1AA;cursor:not-allowed}
.checkin-btn.done{border-color:var(--green);background:var(--green-soft);color:var(--green);cursor:default}
.checkin-box{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:26px 22px;text-align:center;margin-top:24px;box-shadow:var(--shadow-card)}
.checkin-box h2{font-size:19px;margin-bottom:6px}
.checkin-box>p{font-size:13px;color:var(--muted);margin-bottom:20px}
.photo-wall{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.photo-wall.empty{display:none}
.photo-item{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;
  background:var(--green-soft);box-shadow:0 4px 12px rgba(34,78,57,.1)}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.photo-item .tag{position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(transparent,rgba(34,78,57,.72));color:#fff;font-size:10px;
  padding:12px 6px 5px;text-align:left;font-weight:600}
.checkin-list{display:flex;flex-direction:column;gap:9px;margin-bottom:20px}
.checkin-list.empty{display:none}
.checkin-row{display:flex;align-items:center;gap:11px;background:var(--green-soft);
  border:1px solid #CFE0D5;border-radius:12px;padding:10px 14px;text-align:left}
.checkin-row .idx{flex:none;width:26px;height:26px;border-radius:50%;background:var(--green);
  color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.checkin-row .rname{font-size:14px;font-weight:700;color:var(--ink);flex:1;min-width:0}
.checkin-row .rtype{font-size:11px;color:var(--muted);flex:none}
.final-reward{display:none;margin-bottom:20px}
.final-reward.show{display:block}
.final-reward .fr-card{background:var(--orange-soft);border:2px solid var(--orange);
  border-radius:16px;padding:20px 18px;text-align:center}
.final-reward .fr-label{font-size:12px;font-weight:700;letter-spacing:1.5px;
  color:var(--orange);margin-bottom:8px}
.final-reward .fr-name{font-size:22px;font-weight:800;color:var(--ink);line-height:1.4}
#rewardCanvas{max-width:100%;border-radius:14px;box-shadow:0 12px 32px rgba(34,78,57,.16);display:none}
#rewardCanvas.show{display:inline-block}
.modal-mask{position:fixed;inset:0;background:rgba(34,53,43,.48);display:none;
  align-items:center;justify-content:center;padding:24px;z-index:100;backdrop-filter:blur(2px)}
.modal-mask.show{display:flex}
.modal-card{background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:340px;
  text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card h3{font-size:20px;color:var(--ink);margin-bottom:8px}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.modal-btn{width:100%;margin-bottom:10px}
.modal-close{border:none;background:none;color:var(--muted);font-size:13px;cursor:pointer;
  font-family:inherit;padding:6px;font-weight:600}
.gift-box{width:84px;height:84px;margin:0 auto 16px;border-radius:18px;
  background:linear-gradient(135deg,var(--orange),#C95F28);color:#fff;font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:20px;letter-spacing:2px;
  box-shadow:0 10px 24px rgba(224,122,62,.4);animation:shake .8s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.reward-pop #rewardTitle{color:var(--orange);font-size:21px;line-height:1.4}
@media (max-width:560px){
  .photo-wall{grid-template-columns:repeat(3,1fr)}
  .checkin-box{padding:22px 16px}
}
@media (prefers-reduced-motion:reduce){
  .cube{transition-duration:.01ms}
  .gift-box{animation:none}
  .modal-card{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="kicker">VIBE CODING · 赛博小破烂 001</span>
    <h1>City Walk <span class="accent">随机路线骰子</span></h1>
    <p class="subtitle">选择困难症的周末摆渡人：摇一下，命运替你决定去哪、怎么走、干什么。</p>
  </header>

  <section class="panel">
    <div class="field">
      <label>城市</label>
      <div class="btn-group" id="cityGroup">
        <button class="chip active">广州</button>
        <button class="chip" disabled>深圳（点菜解锁）</button>
        <button class="chip" disabled>佛山（点菜解锁）</button>
      </div>
    </div>
    <div class="field">
      <label>漫游剧本</label>
      <div class="btn-group" id="sceneGroup">
        <button class="chip active" data-scene="random">随机版</button>
        <button class="chip" data-scene="park">公园版</button>
        <button class="chip" data-scene="community">社区版</button>
        <button class="chip" data-scene="food">美食版</button>
      </div>
    </div>
    <div class="field">
      <label>社交模式</label>
      <div class="btn-group" id="modeGroup">
        <button class="chip active" data-mode="i">i 人模式（零社交）</button>
        <button class="chip" data-mode="e">e 人模式（轻度社牛）</button>
      </div>
    </div>
    <div class="field">
      <label>新鲜事挑战</label>
      <div class="btn-group" id="freshGroup">
        <button class="chip active" data-fresh="on">今日尝鲜（开启）</button>
        <button class="chip" data-fresh="off">今日算了（关闭）</button>
      </div>
    </div>
  </section>

  <section class="dice-grid cols-6" id="diceGrid"></section>

  <section class="actions">
    <button class="big-btn primary" id="rollAllBtn">一键开摇</button>
    <button class="big-btn warn" id="rerollBtn" disabled>反悔重摇（仅剩 1 次）</button>
    <button class="big-btn dark" id="passBtn" disabled>生成漫游通行证</button>
    <span class="hint-text">每颗骰子最多摇 3 次，满 3 次即最终结果；落定中不可重复点击。</span>
  </section>

  <section class="timer-box">
    <span class="timer-label">行程计时</span>
    <span class="timer-num" id="timerNum">00:00</span>
    <button class="mini-btn" id="timerStart">开始</button>
    <button class="mini-btn" id="timerReset">重置</button>
  </section>

  <section class="pass-box">
    <h2>今日漫游通行证</h2>
    <p>骰子全部落定后生成，可保存图片发朋友圈/小红书。</p>
    <canvas id="passCanvas" width="750" height="1050"></canvas>
    <div class="pass-actions">
      <button class="big-btn primary" id="downloadBtn" style="display:none">保存通行证图片</button>
    </div>
  </section>

  <section class="review-box">
    <h2>行程复盘 · 给命运打分</h2>
    <p>走完回来点评：本次安排值几颗星，哪一颗是本程亮点。</p>
    <div class="review-stars" id="reviewStars"></div>
    <div class="review-hl-title">本程亮点</div>
    <div class="review-highlight" id="highlightRow"></div>
    <div class="review-comment" id="reviewComment">先打星，再点亮点</div>
    <canvas id="reviewCanvas" width="750" height="560"></canvas>
    <div class="pass-actions">
      <button class="big-btn primary" id="reviewSaveBtn" style="display:none">保存复盘卡图片</button>
    </div>
  </section>

  <input type="file" id="photoInput" accept="image/*" style="display:none">

  <section class="checkin-box">
    <h2>行程打卡 · 最后抽盲盒</h2>
    <p>每到一个地方，拍照或定位打卡；行程结束后统一抽取一个小确幸盲盒。</p>
    <div class="photo-wall" id="photoWall"></div>
    <div class="checkin-list" id="checkinList"></div>
    <div class="pass-actions">
      <button class="big-btn warn" id="drawBlindBtn" disabled>抽取今日盲盒</button>
    </div>
    <div class="final-reward" id="finalReward"></div>
    <div class="pass-actions">
      <button class="big-btn primary" id="rewardCardBtn" disabled>生成今日小确幸卡</button>
    </div>
    <canvas id="rewardCanvas" width="750" height="760"></canvas>
    <div class="pass-actions">
      <button class="big-btn primary" id="rewardSaveBtn" style="display:none">保存小确幸卡图片</button>
    </div>
  </section>

  <div class="modal-mask" id="checkinModal">
    <div class="modal-card">
      <h3>选择打卡方式</h3>
      <p class="modal-sub" id="checkinTarget"></p>
      <button class="big-btn primary modal-btn" id="photoCheckin">拍照打卡</button>
      <button class="big-btn dark modal-btn" id="locCheckin">定位打卡</button>
      <button class="modal-close" id="checkinCancel">取消</button>
    </div>
  </div>

  <div class="modal-mask" id="rewardModal">
    <div class="modal-card reward-pop">
      <div class="gift-box" id="giftBox">盲盒</div>
      <h3 id="rewardTitle"></h3>
      <p class="modal-sub">恭喜你抽中今日小确幸</p>
      <button class="big-btn primary modal-btn" id="rewardOk">收下</button>
    </div>
  </div>
</div>

<script>
/* ============ 广州地铁站（真实站点，按线路抽取） ============ */
const STATIONS=[

  ["1号线","杨箕"],["1号线","体育西路"],["1号线","体育中心"],["1号线","广州东站"],
  ["2号线","嘉禾望岗"],["2号线","三元里"],["2号线","广州火车站"],["2号线","越秀公园"],
  ["2号线","纪念堂"],["2号线","海珠广场"],["2号线","市二宫"],["2号线","江南西"],["2号线","昌岗"],
  ["2号线","江泰路"],["2号线","东晓南"],["2号线","洛溪"],["2号线","广州南站"],
  ["3号线","同和"],["3号线","京溪南方医院"],["3号线","梅花园"],["3号线","燕塘"],
  ["3号线","珠江新城"],["3号线","广州塔"],["3号线","客村"],["3号线","大塘"],["3号线","沥滘"],
  ["3号线","厦滘"],["3号线","大石"],["3号线","汉溪长隆"],["3号线","市桥"],["3号线","番禺广场"],
  ["4号线","黄村"],["4号线","车陂"],["4号线","车陂南"],["4号线","万胜围"],["4号线","官洲"],
  ["4号线","大学城北"],["4号线","大学城南"],["4号线","新造"],["4号线","海傍"],["4号线","蕉门"],["4号线","金洲"],

function rollOne(key,force){

  const myEpoch=epoch;
  if(!state.faces[key]||(key==="task"&&state.crazyUsed&&!state._crazyFilled))state.faces[key]=optionPool(key);
  fillFaces(key,state.faces[key]);
  const cube=document.getElementById("cube-"+key);
  const idx=Math.floor(Math.random()*6),extra=720*(2+Math.floor(Math.random()*2));
  state.results[key]=state.faces[key][idx];  // 立即落定结果，供后续骰子的 optionPool 协调
  cube.style.transform=FACE_ROT[idx]
    .replace(/rotateX\((-?\d+)deg\)/,(m,d)=>"rotateX("+(parseInt(d,10)+extra)+"deg)")
    .replace(/rotateY\((-?\d+)deg\)/,(m,d)=>"rotateY("+(parseInt(d,10)+extra)+"deg)");
  const st=document.getElementById("status-"+key);
  st.textContent="落定中…";st.classList.remove("done");
  setTimeout(()=>{
    rolling[key]=false;
    if(myEpoch!==epoch)return;
    state.rolled[key]=true;
    state.results[key]=state.faces[key][idx];
    const short=state.results[key].slice(0,10)+(state.results[key].length>10?"…":"");
    const sceneEl=document.querySelector("#cube-"+key).closest(".scene");
    if(rollCount[key]>=3){
      st.textContent="三次已满 · 最终："+short;
      sceneEl.classList.add("exhausted");
    }else{
      st.textContent="已锁定（剩"+(3-rollCount[key])+"次）："+short;
      sceneEl.classList.remove("exhausted");
    }
    st.classList.add("done");
    afterRoll();
  },1150);
}

/* ============ 冲突协调（仅一键开摇后触发，不干预手动单摇） ============ */
function rollCompatible(key,rejectFn){
  if(rolling[key]||(rollCount[key]||0)>=3)return false;
  let faces,idx,tries=0;
  do{
    faces=optionPool(key);
    idx=Math.floor(Math.random()*6);
  }while(rejectFn(faces[idx])&&++tries<25);
  if(rejectFn(faces[idx]))return false;
  state.faces[key]=faces;
  fillFaces(key,faces);
  rolling[key]=true;
  const myEpoch=epoch,cube=document.getElementById("cube-"+key),extra=720*2;
  cube.style.transform=FACE_ROT[idx]
    .replace(/rotateX\((-?\d+)deg\)/,(m,d)=>"rotateX("+(parseInt(d,10)+extra)+"deg)")
    .replace(/rotateY\((-?\d+)deg\)/,(m,d)=>"rotateY("+(parseInt(d,10)+extra)+"deg)");
  const st=document.getElementById("status-"+key);
  st.textContent="协调冲突中…";st.classList.remove("done");
  setTimeout(()=>{
    rolling[key]=false;
    if(myEpoch!==epoch)return;
    state.rolled[key]=true;
    state.results[key]=faces[idx];
    st.textContent="已自动协调："+faces[idx].slice(0,10)+(faces[idx].length>10?"…":"");
    st.classList.add("done");
  },1150);
  return true;
}
function reconcile(){
  const t=state.results.theme;
  const pending=[];
  // 公园：发呆主题，拒绝暴走与广场舞
  if(t&&t.includes("发呆")){
    pending.push(["rule",v=>v.includes("6000步")||v.includes("广场舞")]);
  }
  // 随机/美食：咖啡店、苍蝇馆子，拒绝20元预算
  if(t&&(t.includes("咖啡店")||t.includes("苍蝇馆子"))){
    pending.push(["limit",v=>v.includes("预算20元")]);
  }
  // 社区/随机：菜市场、晨市，拒绝广场舞
  if(t&&(t.includes("菜市场")||t.includes("晨市"))){
    pending.push(["rule",v=>v.includes("广场舞")]);
  }
  // 美食：糖水扫街拒绝甜咸硬指标，早茶拒绝高频进店，夜市拒绝早茶新鲜事
  if(t&&t.includes("糖水")){
    pending.push(["limit",v=>v.includes("甜咸各")]);
  }
  if(t&&t.includes("早茶")){
    pending.push(["rule",v=>v.includes("每20分钟")]);
  }
  if(t&&t.includes("夜市")){
    pending.push(["fresh",v=>v.includes("早茶")]);
  }
  // 跨骰子：高频进店规则拒绝低预算，赤脚新鲜事拒绝长距离暴走
  const rule=state.results.rule,limit=state.results.limit,fresh=state.results.fresh;
  if(rule&&rule.includes("每20分钟")&&/预算(30|40)元/.test(limit)){
    pending.push(["limit",v=>/预算(30|40)元/.test(v)]);
  }
  if(fresh&&fresh.includes("赤脚")&&rule&&rule.includes("6000步")){
    pending.push(["rule",v=>v.includes("6000步")]);
  }
  let failed=false;
  pending.forEach(([k,fn])=>{if(!rollCompatible(k,fn))failed=true;});
  if(failed){
    const st=document.getElementById("status-theme");
    if(st)st.textContent="存在冲突且协调失败，建议整局重摇";
  }
}

function wrapText(text,x,y,maxW,lh){
  let line="";
  for(const ch of text){
    if(ctx.measureText(line+ch).width>maxW&&line){ctx.fillText(line,x,y);y+=lh;line=ch;}
    else line+=ch;
  }
  ctx.fillText(line,x,y);return y;
}

function starPath(cx,cy,r){

  c.font="600 19px -apple-system,'PingFang SC',sans-serif";c.fillStyle="#E07A3E";
  c.fillText(dateStr+" · 打卡 "+entries.length+" 项 · 照片 "+photoN+" 张",W/2,174);
  // 最终盲盒：突出展示
  c.fillStyle="#FBEADD";c.fillRect(110,238,W-220,250);
  c.strokeStyle="#E07A3E";c.lineWidth=3;c.strokeRect(110,238,W-220,250);
  c.fillStyle="#E07A3E";c.font="700 20px -apple-system,'PingFang SC',sans-serif";
  c.fillText("今日盲盒",W/2,290);
  c.fillStyle="#23352B";c.font="800 34px -apple-system,'PingFang SC',sans-serif";
  // 奖励名居中换行
  const reward=state.finalReward;
  if(c.measureText(reward).width>W-280){
    const mid=Math.ceil(reward.length/2);
    c.fillText(reward.slice(0,mid),W/2,380);c.fillText(reward.slice(mid),W/2,428);
  }else c.fillText(reward,W/2,408);
  c.fillStyle="#6E7E73";c.font="500 18px -apple-system,'PingFang SC',sans-serif";
  c.fillText("生活里的小美好，都替你收好啦",W/2,560);
  c.fillStyle="#224E39";c.font="700 24px -apple-system,'PingFang SC',sans-serif";
  c.fillText("愿你每天都被温柔以待",W/2,620);
  c.fillStyle="#6E7E73";c.font="500 17px -apple-system,'PingFang SC',sans-serif";
  c.fillText("City Walk 骰子 · 小确幸收集",W/2,664);
  rewardCanvas.classList.add("show");
  document.getElementById("rewardSaveBtn").style.display="inline-block";
});
document.getElementById("rewardSaveBtn").addEventListener("click",()=>{
  const a=document.createElement("a");
  a.download="今日小确幸卡_"+(state.passNo||"")+".png";
  a.href=rewardCanvas.toDataURL("image/png");a.click();
});
</script>
</body>
</html>
